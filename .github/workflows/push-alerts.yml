# Avisos push con la página cerrada: cada 5 minutos le pide al sitio que mande los avisos nuevos.
# (Vercel Hobby solo permite tareas programadas una vez por día.) GitHub puede demorar algunos minutos
# las tareas programadas; los avisos también salen cuando alguien tiene la página abierta.
name: Avisos push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enviar avisos pendientes
        run: curl -fsS --max-time 60 https://desastres-naturales-rho.vercel.app/api/push/run
